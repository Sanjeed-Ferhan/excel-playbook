<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Microsoft Excel Training</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;
    font-family:"Segoe UI",Inter,Arial,sans-serif;color:#17211c;
    background:radial-gradient(900px 500px at 0% -10%,#e0f2e9,transparent 55%),
      radial-gradient(900px 600px at 100% 0%,#e5ecff,transparent 55%),
      linear-gradient(180deg,#f7faf8,#eef5f1)}
  .card{max-width:460px;width:100%;background:#fff;border:1px solid #e2e9e4;border-radius:18px;
    padding:36px 30px;text-align:center;box-shadow:0 20px 60px rgba(16,60,38,.14)}
  .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 16px;display:grid;place-items:center;
    font-size:28px;color:#fff;background:linear-gradient(135deg,#107c41,#21a366);box-shadow:0 10px 26px rgba(16,124,65,.45)}
  h1{font-size:21px;margin:0 0 8px}
  p{color:#5b6b62;font-size:14px;line-height:1.6;margin:6px 0}
  .gbtn{display:flex;justify-content:center;margin-top:22px;min-height:44px}
  #msg{margin-top:16px;font-size:13.5px;font-weight:700;color:#dc2626;line-height:1.5;min-height:18px}
  .hint{margin-top:16px;font-size:11.5px;color:#93a29a}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">X</div>
    <h1>Microsoft Excel Training</h1>
    <p>This training is private. Sign in with the Google account that has been granted access.</p>
    <div class="gbtn" id="gbtn"></div>
    <div id="msg"></div>
    <div class="hint">Only approved Google accounts can view this training.</div>
  </div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  const msg = document.getElementById('msg');

  async function onSignIn(resp){
    try{
      const r = await fetch('/api/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: resp.credential })
      });
      if (r.ok) { window.location.href = '/'; return; }
      let j = {};
      try { j = await r.json(); } catch(e){}
      msg.textContent = (j.error === 'not_allowed')
        ? 'This Google account is not authorized. Please contact the trainer.'
        : 'Sign-in failed. Please try again.';
    } catch(e){
      msg.textContent = 'Network error. Please try again.';
    }
  }

  async function init(){
    let cfg = {};
    try { cfg = await (await fetch('/api/config')).json(); } catch(e){}
    if(!cfg.clientId){
      msg.textContent = 'Google sign-in is not configured yet (missing GOOGLE_CLIENT_ID).';
      return;
    }
    function start(){
      google.accounts.id.initialize({ client_id: cfg.clientId, callback: onSignIn });
      google.accounts.id.renderButton(document.getElementById('gbtn'), {
        theme: 'filled_blue', size: 'large', text: 'signin_with', shape: 'pill'
      });
    }
    if (window.google && google.accounts) start();
    else window.addEventListener('load', start);
  }
  init();
</script>
</body>
</html>
